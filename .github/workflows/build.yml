# Manual trigger only, on purpose: start a run with scripts/cloud-build.sh. No push or schedule triggers.
name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Release build
        run: swift build -c release -j 2
      - name: Self-test (pure logic only; the runner has no battery, so nothing touches charging)
        run: .build/release/ChargeKeeperProbe selftest
      - name: Read-only probe smoke test (must not crash on a machine without the keys)
        run: .build/release/ChargeKeeperProbe probe || true
      - name: Package
        run: |
          mkdir -p out && cp .build/release/ChargeKeeperProbe out/
          codesign --force -s - out/ChargeKeeperProbe
          tar -C out -czf probe.tgz ChargeKeeperProbe
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeKeeperProbe
          path: probe.tgz
          retention-days: 3
          compression-level: 0
