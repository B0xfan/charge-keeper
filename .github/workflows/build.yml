# Manual trigger only, on purpose: start a run with scripts/cloud-build.sh. No push or schedule triggers.
name: build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the app (Apple chips and Intel, with the Shortcuts actions' metadata)
        run: scripts/make-app.sh
      - name: Self-test (pure logic only; the runner has no battery, so nothing touches charging)
        run: '"build/Charge Keeper.app/Contents/MacOS/ChargeKeeper" --selftest'
      - name: Self-test of the Intel half (under Rosetta, when the runner has it)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "build/Charge Keeper.app/Contents/MacOS/ChargeKeeper" --selftest
          else echo "No Rosetta on this runner: the Intel half was built but not run"; fi
      - name: Read-only smoke test (must not crash on a machine without the limit)
        run: '"build/Charge Keeper.app/Contents/MacOS/ChargeKeeper" --probe || true'
      - name: Shortcuts actions in the app
        run: python3 -I -c 'import json,sys; print(sorted(json.load(open(sys.argv[1]))["actions"]))' "build/Charge Keeper.app/Contents/Resources/Metadata.appintents/extract.actionsdata"
      - name: Package the app
        run: ditto -c -k --keepParent "build/Charge Keeper.app" ChargeKeeper.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChargeKeeper
          path: ChargeKeeper.zip
          retention-days: 3
          compression-level: 0
